{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="site-navigation" aria-label="Main navigation">
      <ul class="site-navigation__links">
        {% for link in site.data.navigation.main %}
        <li><a href="{{ base_path }}{{ link.url }}"{% if link.url == page.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
      <button class="site-search-toggle" type="button" aria-label="Search this site" aria-haspopup="dialog" aria-controls="site-search">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      </button>
    </nav>
  </div>
</div>
<dialog id="site-search" class="site-search-dialog" aria-labelledby="site-search-title">
  <div class="site-search-heading"><h2 id="site-search-title">Search this site</h2><button type="button" class="site-search-close" aria-label="Close search">×</button></div>
  <form role="search" class="site-search-form">
    <label for="site-search-input">Search Home, CV, Research and Others</label>
    <input id="site-search-input" type="search" placeholder="Search papers, grants, research…" autocomplete="off" />
  </form>
  <p id="site-search-status" role="status">Enter a word or phrase to search.</p>
  <ul id="site-search-results"></ul>
</dialog>
<script src="{{ base_path }}/assets/js/site-search.js" defer></script>

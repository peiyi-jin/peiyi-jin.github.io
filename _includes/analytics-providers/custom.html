<script>
(function () {
  var measurementId = '{{ site.analytics.google.tracking_id }}';
  var storageKey = 'peiyi_analytics_opt_out';
  var excluded = false;
  var query = new URLSearchParams(window.location.search);
  try {
    if (query.get('analytics') === 'off') localStorage.setItem(storageKey, '1');
    if (query.get('analytics') === 'on') localStorage.removeItem(storageKey);
    excluded = localStorage.getItem(storageKey) === '1';
  } catch (e) {
    excluded = query.get('analytics') === 'off';
  }
  if (query.has('analytics')) {
    query.delete('analytics');
    var cleanUrl = window.location.pathname + (query.toString() ? '?' + query.toString() : '') + window.location.hash;
    window.history.replaceState(null, '', cleanUrl);
  }
  if (excluded || !/^G-[A-Z0-9]+$/.test(measurementId)) {
    window['ga-disable-' + measurementId] = true;
    return;
  }
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', measurementId, { allow_google_signals: false, allow_ad_personalization_signals: false });
  var tag = document.createElement('script');
  tag.async = true;
  tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
  document.head.appendChild(tag);
})();
</script>

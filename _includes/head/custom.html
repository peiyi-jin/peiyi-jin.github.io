<style>
  body, input, textarea, select, button {
    font-family: "Gentium Basic", Georgia, "Times New Roman", serif;
  }
  .sidebar p, .sidebar li {
    font-family: "Gentium Basic", Georgia, "Times New Roman", serif;
    font-size: 1rem;
  }
  .sidebar h2, .sidebar h3, .sidebar h4, .sidebar h5, .sidebar h6,
  h1, h2, h3, h4, h5, h6, .page__title, .author__name {
    font-family: "Lora", Georgia, serif;
  }

  .sidebar .author__name { font-size: 1.125rem; }

  body,
  .initial-content,
  .page__content {
    background-color: #f6f6f6;
  }

  .masthead {
    background: #fff;
    border-bottom: 1px solid #E3E7EE;
  }

  .site-navigation {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    min-height: 3.25rem;
    font-family: "Lora", Georgia, serif;
  }

  .site-navigation__links {
    display: flex;
    align-items: center;
    gap: 1.75rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .site-navigation__links a,
  .site-navigation__links a:visited {
    display: block;
    padding: 0.75rem 0;
    border-bottom: 2px solid transparent;
    color: #3D4148;
    font-size: 1rem;
    text-decoration: none;
  }

  .site-navigation__links a:hover,
  .site-navigation__links a[aria-current="page"] {
    color: #1F2D5C;
    border-bottom-color: #1F2D5C;
  }

  .site-navigation__links a[aria-current="page"] { font-weight: 600; }

  .university-brand {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex: 0 0 166px;
    margin-left: auto;
    min-height: 44px;
    text-decoration: none;
  }

  .university-brand img {
    display: block;
    width: 166px;
    height: auto;
  }

  @media (max-width: 640px) {
    .site-navigation { flex-wrap: wrap; row-gap: 0; }
    .university-brand {
      order: -1;
      flex-basis: 100%;
      margin-left: 0;
      padding-top: 0.5rem;
    }
    .university-brand img { width: 128px; }
  }

  .site-search-toggle,
  .site-search-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #1F2D5C;
    cursor: pointer;
  }

  .site-search-toggle:hover,
  .site-search-close:hover { background: #EEF2F9; }
  .site-search-close { font-size: 1.75rem; }

  .site-navigation a:focus-visible,
  .site-navigation button:focus-visible,
  .site-search-dialog :focus-visible {
    outline: 2px solid #005C96;
    outline-offset: 4px;
  }

  .site-search-dialog {
    width: min(42rem, calc(100% - 2rem));
    max-height: 85dvh;
    margin: 10vh auto;
    padding: 1.5rem;
    border: 1px solid #D4DAE4;
    border-radius: 8px;
    color: #000;
    background: #fff;
    overflow-y: auto;
  }

  .site-search-dialog::backdrop { background: rgb(20 30 48 / 40%); }
  .site-search-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .site-search-heading h2 { margin: 0; color: #1F2D5C; font-size: 1.4rem; }
  .site-search-form label { display: block; margin: 1rem 0 0.5rem; }
  .site-search-form input { width: 100%; padding: 0.75rem; border: 1px solid #8994A5; background: #fff; color: #000; font: inherit; font-size: 1.125rem; }
  #site-search-results { margin: 0; padding: 0; list-style: none; }
  #site-search-results li { padding: 0.8rem 0; border-top: 1px solid #E3E7EE; }
  #site-search-results a { font-weight: 700; }
  #site-search-results p { margin: 0.4rem 0 0; line-height: 1.5; }

  @media (max-width: 480px) {
    .site-navigation { gap: 0.5rem; }
    .site-navigation__links { gap: 0.9rem; }
    .site-navigation__links a { font-size: 1.05rem; }
  }

  a,
  a:visited,
  .page__content a,
  .author__urls a {
    color: #1F2D5C;
  }

  a:hover,
  a:focus,
  .page__content a:hover,
  .author__urls a:hover {
    color: #1F2D5C;
  }

  .author__avatar,
  .author__avatar img {
    border-radius: 0 !important;
  }

  .author__avatar {
    max-width: 1100px;
  }

  .author__avatar img {
    width: 1100px;
    max-width: 100%;
    height: auto;
  }

  @media (max-width: 768px) {
    .page {
      padding-left: 1rem !important;
      padding-right: 1rem !important;
    }

    .page__content {
      font-size: 1rem;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .masthead__menu-item--lg a {
      font-size: 1.05rem;
    }

    .author__urls li {
      line-height: 1.5;
    }

    .sidebar .author__avatar {
      max-width: 180px;
    }

    .sidebar div.author__avatar {
      margin-left: auto;
      margin-right: auto;
    }

    .sidebar .author__avatar img {
      width: 180px;
      height: auto;
    }

    .sidebar .author__content {
      display: block;
      padding: 0;
      margin-top: 8px;
      text-align: center;
    }

    .sidebar .author__urls-wrapper {
      display: block;
      margin-top: 8px;
      text-align: center;
    }

    .sidebar .author__urls {
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      text-align: left;
    }

    .page__content div[style*="overflow:auto"] {
      overflow: visible !important;
    }

    .page__content span[style*="float:right"],
    .page__content div[style*="float:right"] {
      float: none !important;
      display: block;
      text-align: left !important;
      margin-top: 2px;
    }
  }
</style>
